<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B3C5D" />
<title>لا يوجد اتصال | Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,"IBM Plex Sans Arabic",sans-serif;background:#0B3C5D;color:#fff;text-align:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
  main{max-width:420px}
  button{margin-top:18px;padding:12px 24px;border:0;border-radius:10px;background:#2EC4B6;color:#0B3C5D;font-size:1rem;font-weight:700;cursor:pointer}
  p{line-height:1.8}
</style>
</head>
<body>
<main>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يحتاج التطبيق إلى اتصال بالإنترنت لعرض المحتوى الطبي المحدّث وبياناتك. تأكد من الاتصال ثم أعد المحاولة.</p>
  <p dir="ltr">You're offline. This app needs an internet connection to show up-to-date information. Please reconnect and try again.</p>
  <button onclick="location.reload()">إعادة المحاولة / Retry</button>
</main>
</body>
</html>
