name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
      - 'nativeAlarmService.ts'
      - 'package.json'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure Capacitor Config Exists
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.antibiotic.awareness",
            "appName": "Antibiotic Awareness",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://mmo277.github.io/antibiotic-awareness/",
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          fi

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@^6.1.2 @capacitor/cli@^6.1.2 @capacitor/android@^6.1.2 @capacitor/local-notifications@^6.0.2

      - name: Build Web Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Initialize Capacitor Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions & In-App Google Sign-In Popup WebView
        run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r") as f:
              xml = f.read()
          perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
              "android.permission.RECEIVE_BOOT_COMPLETED"
          ]
          inject = "\n".join([f"    <uses-permission android:name=\"{perm}\" />" for perm in perms if perm not in xml])
          if inject and "</manifest>" in xml:
              xml = xml.replace("</manifest>", inject + "\n</manifest>")
          with open(p, "w") as f:
              f.write(xml)
          '

          cat << 'EOF' > android/app/src/main/java/com/antibiotic/awareness/MainActivity.java
          package com.antibiotic.awareness;

          import android.annotation.SuppressLint;
          import android.app.Dialog;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private static final String CLEAN_CHROME_UA =
                  "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  configureWebViewForGoogleAuth();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  configureWebViewForGoogleAuth();
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void configureWebViewForGoogleAuth() {
                  if (this.bridge == null || this.bridge.getWebView() == null) {
                      return;
                  }
                  final WebView webView = this.bridge.getWebView();
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);
                  settings.setUserAgentString(CLEAN_CHROME_UA);

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new BridgeWebChromeClient(this.bridge) {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          final Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_DeviceDefault_NoActionBar);
                          FrameLayout container = new FrameLayout(MainActivity.this);
                          container.setBackgroundColor(Color.WHITE);

                          final WebView popupWebView = new WebView(MainActivity.this);
                          WebSettings popupSettings = popupWebView.getSettings();
                          popupSettings.setJavaScriptEnabled(true);
                          popupSettings.setDomStorageEnabled(true);
                          popupSettings.setDatabaseEnabled(true);
                          popupSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                          popupSettings.setSupportMultipleWindows(true);
                          popupSettings.setUserAgentString(CLEAN_CHROME_UA);

                          CookieManager cm = CookieManager.getInstance();
                          cm.setAcceptCookie(true);
                          cm.setAcceptThirdPartyCookies(popupWebView, true);

                          popupWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                  return false;
                              }

                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, String url) {
                                  return false;
                              }
                          });

                          popupWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView window) {
                                  try {
                                      if (dialog.isShowing()) {
                                          dialog.dismiss();
                                      }
                                      window.destroy();
                                  } catch (Exception ignored) {}
                              }
                          });

                          FrameLayout.LayoutParams webParams = new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          );
                          container.addView(popupWebView, webParams);

                          TextView closeBtn = new TextView(MainActivity.this);
                          closeBtn.setText("✕ إغلاق");
                          closeBtn.setTextColor(Color.WHITE);
                          closeBtn.setBackgroundColor(Color.parseColor("#0B3C5D"));
                          closeBtn.setPadding(32, 16, 32, 16);
                          closeBtn.setTextSize(14f);
                          FrameLayout.LayoutParams closeParams = new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              Gravity.TOP | Gravity.END
                          );
                          closeParams.setMargins(24, 36, 24, 24);
                          closeBtn.setOnClickListener(v -> {
                              try {
                                  dialog.dismiss();
                                  popupWebView.destroy();
                              } catch (Exception ignored) {}
                          });
                          container.addView(closeBtn, closeParams);

                          dialog.setContentView(container, new ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          ));
                          dialog.setOnDismissListener(d -> {
                              try {
                                  popupWebView.destroy();
                              } catch (Exception ignored) {}
                          });
                          dialog.show();

                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(popupWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });
              }
          }
          EOF

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Antibiotic-Awareness.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntibioticAwareness-Android-App
          path: Antibiotic-Awareness.apk

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 Antibiotic-Awareness.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create v1.0.0 Antibiotic-Awareness.apk \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "تطبيق التوعية بالمضادات الحيوية للأندرويد (Official Android APK)" \
              --notes "النسخة الرسمية لتطبيق التوعية بالمضادات الحيوية للأندرويد (.APK) بتحديث تلقائي فوري ودعم كامل لتسجيل جوجل." \
              --latest
          fi
