name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: | npm install npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications 
      - name: Build Web Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Add Capacitor Android Platform
        run: | npx cap add android || true npx cap sync android 
      - name: Inject Android Permissions & Exact Alarm Receiver
        run: | if [ -f android/app/src/main/AndroidManifest.xml ]; then sed -i '/<\/manifest>/i \ <uses-permission android:name="android.permission.INTERNET" />\n <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n <uses-permission android:name="android.permission.WAKE_LOCK" />\n <uses-permission android:name="android.permission.VIBRATE" />\n <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml fi 
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK with Gradle
        run: | cd android chmod +x gradlew ./gradlew assembleDebug --no-daemon 
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AntibioticAwareness-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
