name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
      - 'nativeAlarmService.ts'
      - 'authContext.tsx'
      - 'AuthModal.tsx'
      - 'package.json'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write Hybrid OTA + Offline Bundled Capacitor Config
        run: |
          cat << 'EOF' > capacitor.config.ts
          const config = {
            appId: 'com.antibiotic.awareness',
            appName: 'Antibiotic Awareness',
            webDir: 'dist',
            bundledWebRuntime: false,
            server: {
              androidScheme: 'https',
              cleartext: true,
              allowNavigation: [
                'mmo277.github.io',
                '*.github.io',
                '*.firebaseapp.com',
                '*.google.com',
                '*.googleapis.com',
                '*.gstatic.com'
              ]
            },
            plugins: {
              LocalNotifications: {
                smallIcon: 'ic_launcher',
                iconColor: '#0B3C5D',
              },
            },
          };
          export default config;
          EOF

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@^6.1.2 @capacitor/cli@^6.1.2 @capacitor/android@^6.1.2 @capacitor/local-notifications@^6.0.2

      - name: Build Web Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Initialize Capacitor Android (Bundles Offline Copy + Enables Live OTA)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Hybrid Smart Boot, Native Google Account Picker & Alarm Receiver
        run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r") as f:
              xml = f.read()
          perms = [
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.USE_FULL_SCREEN_INTENT",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
              "android.permission.RECEIVE_BOOT_COMPLETED"
          ]
          inject_perms = "\n".join([f"    <uses-permission android:name=\"{perm}\" />" for perm in perms if perm not in xml])
          if inject_perms and "</manifest>" in xml:
              xml = xml.replace("</manifest>", inject_perms + "\n</manifest>")
          receiver_tag = "        <receiver android:name=\".DoseAlarmReceiver\" android:enabled=\"true\" android:exported=\"true\" />\n    </application>"
          if ".DoseAlarmReceiver" not in xml and "</application>" in xml:
              xml = xml.replace("</application>", receiver_tag)
          with open(p, "w") as f:
              f.write(xml)
          '

          cat << 'EOF' > android/app/src/main/java/com/antibiotic/awareness/DoseAlarmReceiver.java
          package com.antibiotic.awareness;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;

          public class DoseAlarmReceiver extends BroadcastReceiver {
              public static final String CHANNEL_ID = "med_alarm_clock_v3";

              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      PowerManager pm = (PowerManager) context.getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          PowerManager.WakeLock wl = pm.newWakeLock(
                              PowerManager.PARTIAL_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP,
                              "AntibioticAwareness:DoseAlarmWakeLock"
                          );
                          wl.acquire(15000L);
                      }
                  } catch (Throwable ignored) {}

                  String title = intent != null ? intent.getStringExtra("title") : null;
                  String body = intent != null ? intent.getStringExtra("body") : null;
                  int id = intent != null ? intent.getIntExtra("id", 99999) : 99999;

                  if (title == null || title.isEmpty()) {
                      title = "💊 موعد جرعة الدواء الآن!";
                  }
                  if (body == null || body.isEmpty()) {
                      body = "حان الآن موعد أخذ جرعة المضاد الحيوي في ميعادها.";
                  }

                  Uri alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                  if (alarmUri == null) {
                      alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                  }

                  try {
                      NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID,
                                  "منبه مواعيد الجرعات الدوائية",
                                  NotificationManager.IMPORTANCE_HIGH
                              );
                              channel.setDescription("يرن في مواعيد جرعات الأدوية حتى والتطبيق مغلق");
                              channel.enableVibration(true);
                              channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                              if (alarmUri != null) {
                                  AudioAttributes attrs = new AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_ALARM)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                      .build();
                                  channel.setSound(alarmUri, attrs);
                              }
                              nm.createNotificationChannel(channel);
                          }

                          Intent launchIntent = new Intent(context, MainActivity.class);
                          launchIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              flags |= PendingIntent.FLAG_IMMUTABLE;
                          }
                          PendingIntent contentIntent = PendingIntent.getActivity(context, id, launchIntent, flags);

                          Notification.Builder builder = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                              ? new Notification.Builder(context, CHANNEL_ID)
                              : new Notification.Builder(context);

                          builder.setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                              .setContentTitle(title)
                              .setContentText(body)
                              .setStyle(new Notification.BigTextStyle().bigText(body))
                              .setPriority(Notification.PRIORITY_MAX)
                              .setCategory(Notification.CATEGORY_ALARM)
                              .setVisibility(Notification.VISIBILITY_PUBLIC)
                              .setAutoCancel(true)
                              .setContentIntent(contentIntent);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              builder.setFullScreenIntent(contentIntent, true);
                          }

                          nm.notify(id, builder.build());
                      }
                  } catch (Throwable ignored) {}

                  try {
                      Vibrator vib = (Vibrator) context.getSystemService(Context.VIBRATOR_SERVICE);
                      if (vib != null && vib.hasVibrator()) {
                          long[] pattern = new long[]{0, 600, 300, 600, 300, 800, 300, 800};
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vib.vibrate(VibrationEffect.createWaveform(pattern, -1));
                          } else {
                              vib.vibrate(pattern, -1);
                          }
                      }
                  } catch (Throwable ignored) {}

                  try {
                      if (alarmUri != null) {
                          final Ringtone ringtone = RingtoneManager.getRingtone(context.getApplicationContext(), alarmUri);
                          if (ringtone != null) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                  ringtone.setLooping(false);
                              }
                              ringtone.play();
                              new Handler(Looper.getMainLooper()).postDelayed(() -> {
                                  try {
                                      if (ringtone.isPlaying()) {
                                          ringtone.stop();
                                      }
                                  } catch (Throwable ignored) {}
                              }, 10000L);
                          }
                      }
                  } catch (Throwable ignored) {}
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/antibiotic/awareness/MainActivity.java
          package com.antibiotic.awareness;

          import android.accounts.AccountManager;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.Dialog;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final String LIVE_OTA_URL = "https://mmo277.github.io/antibiotic-awareness/";
              private static final String LOCAL_OFFLINE_URL = "https://localhost";
              private static final String CLEAN_CHROME_UA =
                  "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
              private boolean isWebViewConfigured = false;

              private boolean isDeviceOnline() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return false;
                      NetworkInfo info = cm.getActiveNetworkInfo();
                      return info != null && info.isConnected();
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private void notifyJsGoogleAccountResult(final String email) {
                  try {
                      runOnUiThread(() -> {
                          try {
                              if (this.bridge != null && this.bridge.getWebView() != null) {
                                  String safe = email == null ? "" : email.replace("'", "").replace("\"", "");
                                  this.bridge.getWebView().evaluateJavascript(
                                      "if(window.__onAndroidGoogleAccountPicked){window.__onAndroidGoogleAccountPicked('" + safe + "');}",
                                      null
                                  );
                              }
                          } catch (Throwable ignored) {}
                      });
                  } catch (Throwable ignored) {}
              }

              private void requestGoogleOAuthTokenForAccount(final String email) {
                  try {
                      final AccountManager am = AccountManager.get(MainActivity.this);
                      final android.accounts.Account account = new android.accounts.Account(email, "com.google");
                      final String scope = "oauth2:https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile";
                      am.getAuthToken(
                          account,
                          scope,
                          null,
                          MainActivity.this,
                          future -> {
                              new Thread(() -> {
                                  try {
                                      android.os.Bundle bundle = future.getResult();
                                      String token = bundle.getString(AccountManager.KEY_AUTHTOKEN);
                                      if (token != null && !token.isEmpty()) {
                                          am.invalidateAuthToken("com.google", token);
                                          android.os.Bundle freshBundle = am.getAuthToken(
                                              account, scope, null, MainActivity.this, null, null
                                          ).getResult();
                                          String freshToken = freshBundle.getString(AccountManager.KEY_AUTHTOKEN);
                                          if (freshToken != null && !freshToken.isEmpty()) {
                                              token = freshToken;
                                          }
                                          notifyJsGoogleAccountResult(email + "|" + token);
                                          return;
                                      }
                                  } catch (Throwable ignored) {}
                                  notifyJsGoogleAccountResult(email);
                              }).start();
                          },
                          null
                      );
                  } catch (Throwable t) {
                      notifyJsGoogleAccountResult(email);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 9001) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          String accountName = data.getStringExtra(AccountManager.KEY_ACCOUNT_NAME);
                          if (accountName != null && !accountName.isEmpty()) {
                              requestGoogleOAuthTokenForAccount(accountName);
                              return;
                          }
                      }
                      notifyJsGoogleAccountResult("__CANCELLED__");
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  if (!isWebViewConfigured) {
                      isWebViewConfigured = true;
                      configureWebViewSafely();
                  }
              }

              private void requestNotificationPermissionIfNeeded() {
                  try {
                      if (Build.VERSION.SDK_INT >= 33) {
                          if (checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 101);
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              public class AndroidAlarmBridge {
                  @JavascriptInterface
                  public boolean isAvailable() {
                      return true;
                  }

                  @JavascriptInterface
                  public void requestPermissions() {
                      runOnUiThread(() -> requestNotificationPermissionIfNeeded());
                  }

                  @JavascriptInterface
                  public boolean pickGoogleAccount() {
                      try {
                          runOnUiThread(() -> {
                              try {
                                  Intent intent = AccountManager.newChooseAccountIntent(
                                      null,
                                      null,
                                      new String[]{"com.google"},
                                      null,
                                      null,
                                      null,
                                      null
                                  );
                                  startActivityForResult(intent, 9001);
                              } catch (Throwable t) {
                                  notifyJsGoogleAccountResult("__CANCELLED__");
                              }
                          });
                          return true;
                      } catch (Throwable t) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean getGoogleTokenForEmail(final String email) {
                      if (email == null || email.trim().isEmpty()) return false;
                      try {
                          runOnUiThread(() -> requestGoogleOAuthTokenForAccount(email.trim()));
                          return true;
                      } catch (Throwable t) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean scheduleExactAlarm(int id, double triggerAtMillisDouble, String title, String body) {
                      try {
                          runOnUiThread(() -> requestNotificationPermissionIfNeeded());
                          long triggerAtMillis = (long) triggerAtMillisDouble;
                          if (triggerAtMillis <= System.currentTimeMillis()) {
                              triggerAtMillis = System.currentTimeMillis() + 3000L;
                          }
                          Context ctx = getApplicationContext();
                          AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                          if (am == null) return false;

                          Intent intent = new Intent(ctx, DoseAlarmReceiver.class);
                          intent.setAction("com.antibiotic.awareness.DOSE_ALARM_" + id);
                          intent.putExtra("id", id);
                          intent.putExtra("title", title);
                          intent.putExtra("body", body);

                          int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              flags |= PendingIntent.FLAG_IMMUTABLE;
                          }
                          PendingIntent pi = PendingIntent.getBroadcast(ctx, id, intent, flags);

                          Intent showIntent = new Intent(ctx, MainActivity.class);
                          PendingIntent showPi = PendingIntent.getActivity(ctx, id, showIntent, flags);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              AlarmManager.AlarmClockInfo clockInfo = new AlarmManager.AlarmClockInfo(triggerAtMillis, showPi);
                              am.setAlarmClock(clockInfo, pi);
                          } else {
                              am.setExact(AlarmManager.RTC_WAKEUP, triggerAtMillis, pi);
                          }
                          return true;
                      } catch (Throwable t) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean cancelAlarm(int id) {
                      try {
                          Context ctx = getApplicationContext();
                          AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                          if (am == null) return false;
                          Intent intent = new Intent(ctx, DoseAlarmReceiver.class);
                          intent.setAction("com.antibiotic.awareness.DOSE_ALARM_" + id);
                          int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              flags |= PendingIntent.FLAG_IMMUTABLE;
                          }
                          PendingIntent pi = PendingIntent.getBroadcast(ctx, id, intent, flags);
                          am.cancel(pi);
                          return true;
                      } catch (Throwable t) {
                          return false;
                      }
                  }
              }

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              private void configureWebViewSafely() {
                  try {
                      requestNotificationPermissionIfNeeded();
                      if (this.bridge == null || this.bridge.getWebView() == null) {
                          return;
                      }
                      final WebView webView = this.bridge.getWebView();
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setJavaScriptCanOpenWindowsAutomatically(true);
                      settings.setSupportMultipleWindows(true);
                      settings.setUserAgentString(CLEAN_CHROME_UA);

                      webView.addJavascriptInterface(new AndroidAlarmBridge(), "AndroidAlarmBridge");

                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(webView, true);

                      final WebViewClient capacitorWebViewClient =
                          (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ? webView.getWebViewClient() : null;

                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              if (capacitorWebViewClient != null) {
                                  return capacitorWebViewClient.shouldInterceptRequest(view, request);
                              }
                              return super.shouldInterceptRequest(view, request);
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              return false;
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              return false;
                          }

                          @Override
                          public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                              try {
                                  if (request != null && request.isForMainFrame()) {
                                      view.loadUrl(LOCAL_OFFLINE_URL);
                                      return;
                                  }
                              } catch (Throwable ignored) {}
                              super.onReceivedError(view, request, error);
                          }
                      });

                      if (isDeviceOnline()) {
                          settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                          webView.loadUrl(LIVE_OTA_URL);
                      } else {
                          settings.setCacheMode(WebSettings.LOAD_CACHE_ELSE_NETWORK);
                      }

                      final WebChromeClient defaultClient =
                          (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ? webView.getWebChromeClient() : null;

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public boolean onShowFileChooser(
                              WebView wv,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams
                          ) {
                              if (defaultClient != null) {
                                  return defaultClient.onShowFileChooser(wv, filePathCallback, fileChooserParams);
                              }
                              return super.onShowFileChooser(wv, filePathCallback, fileChooserParams);
                          }

                          @Override
                          public void onPermissionRequest(PermissionRequest request) {
                              if (defaultClient != null) {
                                  defaultClient.onPermissionRequest(request);
                              } else {
                                  super.onPermissionRequest(request);
                              }
                          }

                          @Override
                          public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                              try {
                                  final Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_DeviceDefault_NoActionBar);
                                  FrameLayout container = new FrameLayout(MainActivity.this);
                                  container.setBackgroundColor(Color.WHITE);

                                  final WebView popupWebView = new WebView(MainActivity.this);
                                  WebSettings popupSettings = popupWebView.getSettings();
                                  popupSettings.setJavaScriptEnabled(true);
                                  popupSettings.setDomStorageEnabled(true);
                                  popupSettings.setDatabaseEnabled(true);
                                  popupSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                                  popupSettings.setSupportMultipleWindows(true);
                                  popupSettings.setUserAgentString(CLEAN_CHROME_UA);

                                  CookieManager cm = CookieManager.getInstance();
                                  cm.setAcceptCookie(true);
                                  cm.setAcceptThirdPartyCookies(popupWebView, true);

                                  popupWebView.setWebViewClient(new WebViewClient() {
                                      @Override
                                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                          return false;
                                      }

                                      @Override
                                      public boolean shouldOverrideUrlLoading(WebView v, String url) {
                                          return false;
                                      }
                                  });

                                  popupWebView.setWebChromeClient(new WebChromeClient() {
                                      @Override
                                      public void onCloseWindow(WebView window) {
                                          try {
                                              if (dialog.isShowing()) {
                                                  dialog.dismiss();
                                              }
                                              window.destroy();
                                          } catch (Throwable ignored) {}
                                      }
                                  });

                                  FrameLayout.LayoutParams webParams = new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.MATCH_PARENT
                                  );
                                  container.addView(popupWebView, webParams);

                                  TextView closeBtn = new TextView(MainActivity.this);
                                  closeBtn.setText("✕ إغلاق");
                                  closeBtn.setTextColor(Color.WHITE);
                                  closeBtn.setBackgroundColor(Color.parseColor("#0B3C5D"));
                                  closeBtn.setPadding(32, 16, 32, 16);
                                  closeBtn.setTextSize(14f);
                                  FrameLayout.LayoutParams closeParams = new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      Gravity.TOP | Gravity.END
                                  );
                                  closeParams.setMargins(24, 36, 24, 24);
                                  closeBtn.setOnClickListener(v -> {
                                      try {
                                          dialog.dismiss();
                                          popupWebView.destroy();
                                      } catch (Throwable ignored) {}
                                  });
                                  container.addView(closeBtn, closeParams);

                                  dialog.setContentView(container, new ViewGroup.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.MATCH_PARENT
                                  ));
                                  dialog.setOnDismissListener(d -> {
                                      try {
                                          popupWebView.destroy();
                                      } catch (Throwable ignored) {}
                                  });
                                  dialog.show();

                                  WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                                  transport.setWebView(popupWebView);
                                  resultMsg.sendToTarget();
                                  return true;
                              } catch (Throwable t) {
                                  return false;
                              }
                          }
                      });
                  } catch (Throwable ignored) {
                      // Safe fallback: never crash the Activity
                  }
              }
          }
          EOF

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Antibiotic-Awareness.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntibioticAwareness-Android-App
          path: Antibiotic-Awareness.apk

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 Antibiotic-Awareness.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create v1.0.0 Antibiotic-Awareness.apk \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "تطبيق التوعية بالمضادات الحيوية للأندرويد (Official Android APK)" \
